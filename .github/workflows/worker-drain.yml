name: Worker Drain

on:
  workflow_dispatch:
    # Manual emergency drain for queue recovery.
    # Audit processing is event-triggered by intake at submission time.
    # Run this action only when jobs are stuck or intake-triggered processing failed.

jobs:
  drain:
    name: Drain one audit job
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Call protected worker endpoint
        shell: bash
        env:
          WORKER_DRAIN_URL: ${{ secrets.WORKER_DRAIN_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_DRAIN_URL" ] || [ -z "$WORKER_SECRET" ]; then
            echo "WORKER_DRAIN_URL and WORKER_SECRET repository secrets are required."
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            --max-time 300 \
            --request POST \
            --header "content-type: application/json" \
            --header "x-worker-secret: ${WORKER_SECRET}" \
            --data '{}' \
            "${WORKER_DRAIN_URL}"
